# HTTPRoute: the app team's routing rules, in their own namespace. Attaches to
# the Gateway via parentRefs and sends Host "webapp.local.dev" to the Service.
# Advanced routing (weights for canary, header matches, etc.) are first-class
# fields here — no controller-specific annotations.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webapp-route
  namespace: demo-app
spec:
  parentRefs:
  - name: eg-gateway
    namespace: envoy-gateway-system
  hostnames:
  - "webapp.local.dev"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: webapp-service
      port: 80
      weight: 100
