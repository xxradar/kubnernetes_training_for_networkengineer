# A pod that consumes the PVC. The pod references the CLAIM, never the disk.
# Mounting it triggers the provisioner to create the PV (WaitForFirstConsumer).
# Data written to /data lives in the PV and survives pod delete/recreate.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
  namespace: storage-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","sleep 3600"]
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: pvc-demo
