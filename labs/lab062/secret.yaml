# Declarative form of:
#   kubectl create secret generic db-cred --from-literal=DB_USER=admin ...
# stringData lets you write plain text; the API server base64-encodes it into
# .data. Remember: base64 is encoding, NOT encryption. RBAC + encryption-at-rest
# are the real protections.
apiVersion: v1
kind: Secret
metadata:
  name: db-cred
  namespace: config-demo
type: Opaque
stringData:
  DB_USER: admin
  DB_PASSWORD: s3cr3t
